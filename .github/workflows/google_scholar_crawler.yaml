name: Get Citation Data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
      - "_config.yml"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Fetch Google Scholar statistics
        env:
          GOOGLE_SCHOLAR_ID: UiWugpoAAAAJ
        run: python3 google_scholar_crawler/main.py

      - name: Publish statistics branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd google_scholar_crawler/results
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b google-scholar-stats
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar statistics"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:google-scholar-stats
